name: Build Windows EXE (PyInstaller)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # GitHub web arayüzünden manuel tetikleme

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install dxcam opencv-python numpy pywin32 pyinstaller

      - name: PyInstaller ile EXE Oluştur
        run: |
          pyinstaller --onefile --noconsole --collect-all dxcam pc_colorbot_bridge.py

      - name: EXE Dosyasını Artifact Yaparak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: PC-Colorbot-Bridge-EXE
          path: dist/pc_colorbot_bridge.exe
          
