name: Build Colorbot EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Repoyu Klonla
      uses: actions/checkout@v4

    - name: Python 3.11 Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller bettercam opencv-python numpy mss

    - name: PyInstaller ile Tek Dosya EXE Derle
      run: |
        pyinstaller --noconfirm --onefile --console --name "ColorbotPC" colorbot_pc.py

    - name: EXE Dosyasını Artifact Olarak Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: ColorbotPC-Executable
        path: dist/ColorbotPC.exe
        
