name: Build Colorbot EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Repoyu Klonla
      uses: actions/checkout@v4

    - name: Python 3.11 Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller mss opencv-python-headless numpy pywin32

    - name: PyInstaller ile Exe Derle
      run: |
        pyinstaller --noconfirm --onefile --uac-admin --console --collect-all mss --name "WinServicesHost" colorbot_pc.py

    - name: EXE Dosyasını Artifact Olarak Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: WinServicesHost-Executable
        path: dist/WinServicesHost.exe
        
